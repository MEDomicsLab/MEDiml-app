appId: com.medomicslab.mediml
productName: MEDiml
copyright: Copyright © 2026 MEDomicsLab Team
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
extraResources: # extra resources to be copied into the app bundle
  - from: ./go_executables # Source directory
    to: go_executables # Destination directory inside Contents/Resources
    filter:
      - server_go
      - server_go_win32.exe
  - from: ./pythonCode # Source directory
    to: pythonCode # Destination directory inside Contents/Resources
    # Exclude pycache and other unnecessary files
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.git"
      - "!**/.git/**"
  - from: ./pythonEnv # Source directory
    to: pythonEnv # Destination directory inside Contents/Resources
    filter:
      - "**/*"
      - "!**/.git"
      - "!**/.git/**"
publish:
  provider: github
  owner: "MEDomicsLab"
  repo: "MEDiml-app"
  releaseType: "draft"
